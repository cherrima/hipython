<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3 파일 목록</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
            border-bottom: 3px solid #007bff;
            padding-bottom: 10px;
        }
        .files {
            background: white;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .file {
            padding: 12px;
            border-bottom: 1px solid #eee;
            display: flex; /* 버튼 배치를 위해 추가 */
            justify-content: space-between;
            align-items: center;
        }
        .file:hover {
            background: #f0f8ff;
        }
        .file:last-child {
            border-bottom: none;
        }
        .file-info {
            flex-grow: 1;
        }
        a {
            color: #007bff;
            text-decoration: none;
            font-size: 16px;
        }
        a:hover {
            text-decoration: underline;
        }
        /* 삭제 버튼 스타일 */
        .delete-btn {
            background-color: #ff4d4f;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        .delete-btn:hover {
            background-color: #d9363e;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .error {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 5px;
            color: #856404;
        }
        .success {
            background: #d4edda;
            border: 1px solid #28a745;
            padding: 10px 15px;
            border-radius: 5px;
            color: #155724;
            margin-bottom: 15px;
        }
    </style>

    <style>
    /* 기존 스타일에 업로드 관련 스타일 추가 */
        .upload-section {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .upload-section h2 {
            font-size: 18px;
            margin-top: 0;
            color: #333;
        }
        .upload-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="file"] {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .upload-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .upload-btn:hover { background-color: #218838; }
        .upload-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        
        hr {
            border: 0;
            height: 1px;
            background: #ddd;
            margin: 40px 0 20px 0;
        }
    </style>

</head>
 <!-- ... (이전 스타일 동일) ... -->
<body>
    <h1>📁 S3 버킷 파일 목록</h1>
    <!-- 수정 포인트 1: id="envTag" 엘리먼트 추가 및 레이아웃 정리 -->
    <p style="color: #666;">
        버킷: <span id="bucketNameDisplay">dev-insta-uploaded-files-05</span> | 
        환경: <strong id="envTag">-</strong>
    </p>
    
    <div class="files" id="fileList">
        <div class="loading">파일 목록을 불러오는 중...</div>
    </div>

    <!-- 구획 나누기 및 업로드 메뉴 추가 -->
    <hr>
    
    <div class="upload-section">
        <h2>📤 새 파일 업로드</h2>
        <div class="upload-form">
            <input type="file" id="fileInput">
            <button class="upload-btn" id="uploadBtn" onclick="uploadFile()">업로드 시작</button>
        </div>
        <p id="uploadStatus" style="margin-top:10px; font-size:14px;"></p>
    </div>


    <script>
        // 백엔드(main.py)에서 치환될 부분
        const CONFIG = {
            bucket: 'dev-insta-uploaded-files-05',
            region: 'ap-northeast-2',
            env: 'dev'   // 별도 지정
        };

        async function initEnv() {
            try {
                // 2. 서버에서 'env' 정보만 가져오기
                const response = await fetch('/env');
                const data = await response.json();
                
                // 3. 받아온 값 주입
                CONFIG.env = data.phase; 

                // 4. UI 업데이트 로직 실행
                updateUI();

                // 환경 정보가 설정된 "후"에 파일 목록을 불러옵니다.
                // (S3 URL 구성에 CONFIG 정보가 필요할 수 있기 때문입니다.)
                await loadFiles();

            } catch (e) {
                console.error("환경 설정 로드 실패", e);
            }
        }

        function updateUI() {
            const envTag = document.getElementById('envTag');
            if (!envTag) return;

            // 문자열 비교 시 .trim()을 사용하면 공백 에러를 방지할 수 있습니다.
            const isProd = CONFIG.env.trim() === 'prod';
            envTag.innerText = isProd ? '운영' : '개발';
            envTag.style.color = isProd ? '#ff4d4f' : '#28a745';
        }

        // // 수정 포인트 2: 환경 표시 로직 (엘리먼트가 없으면 에러가 발생하여 다음 코드가 실행 안 됨)
        // const envTag = document.getElementById('envTag');
        // console.log("현재 설정된 환경: [" + CONFIG.env + "]");
        // if (envTag) {
        //     if (CONFIG.env == 'prod') {
        //         envTag.innerText = '운영';
        //         envTag.style.color = '#ff4d4f';

        //     } else {
        //         envTag.innerText = '개발';
        //         envTag.style.color = '#28a745';
        //     }
        // }

        // 수정 포인트 3: 중복 선언 제거 및 CONFIG 활용
        const bucketUrl = `https://${CONFIG.bucket}.s3.${CONFIG.region}.amazonaws.com`;

        async function deleteImage(filename) {
            if (!confirm(`'${filename}' 파일을 정말 삭제하시겠습니까?`)) return;
            try {
                const response = await fetch(`/images/${filename}`, { method: 'DELETE' });
                if (response.ok) {
                    alert('성공적으로 삭제되었습니다.');
                    loadFiles();
                } else {
                    const errorMsg = await response.text();
                    alert(`삭제 실패: ${response.status} - ${errorMsg}`);
                }
            } catch (error) {
                console.error('❌ 삭제 오류:', error);
                alert('삭제 중 오류가 발생했습니다.');
            }
        }

        async function loadFiles() {
            try {
                // S3 URL이 정확한지 콘솔에서 확인 가능
                console.log('🔍 호출 URL:', `${bucketUrl}?list-type=2`);
                
                const response = await fetch(`${bucketUrl}?list-type=2`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: S3 접근 권한이 없거나 CORS 설정이 필요합니다.`);
                }
                
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                const files = xml.getElementsByTagName('Contents');
                
                if (files.length === 0) {
                    document.getElementById('fileList').innerHTML = 
                        '<div class="loading">📭 버킷이 비어있습니다.</div>';
                    return;
                }

                let html = '<div class="success">✅ 파일 목록을 성공적으로 불러왔습니다!</div>';
                
                for (let file of files) {
                    const name = file.getElementsByTagName('Key')[0].textContent;
                    const url = `${bucketUrl}/${name}`;
                    
                    let icon = '📄';
                    if (name.match(/\.(jpg|jpeg|png|gif|webp)$/i)) icon = '🖼️';
                    else if (name.match(/\.(txt|md)$/i)) icon = '📝';
                    else if (name.match(/\.(json|xml)$/i)) icon = '📋';
                    else if (name.match(/\.(html|htm)$/i)) icon = '🌐';
                    
                    html += `
                        <div class="file">
                            <div class="file-info">
                                <a href="${url}" target="_blank">${icon} ${name}</a>
                            </div>
                            <button class="delete-btn" onclick="deleteImage('${name}')">삭제</button>
                        </div>`;
                }
                document.getElementById('fileList').innerHTML = html;

            } catch (error) {
                console.error('❌ 목록 로드 오류:', error);
                document.getElementById('fileList').innerHTML = 
                    `<div class="error">
                        <strong>❌ 목록을 가져오지 못했습니다:</strong><br>${error.message}
                    </div>`;
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const uploadBtn = document.getElementById('uploadBtn');
            const status = document.getElementById('uploadStatus');

            if (!fileInput.files[0]) {
                alert('업로드할 파일을 선택해주세요.');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                // UI 상태 변경
                uploadBtn.disabled = true;
                uploadBtn.innerText = '업로드 중...';
                status.innerText = '⏳ S3로 파일을 전송하고 있습니다...';
                status.style.color = '#666';

                const response = await fetch('/images', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const result = await response.json();
                    status.innerText = `✅ 업로드 성공! (파일명: ${result.filename})`;
                    status.style.color = '#28a745';
                    fileInput.value = ''; // 입력창 초기화
                    
                    // 핵심: 업로드 성공 후 목록 새로고침
                    loadFiles(); 
                } else {
                    const err = await response.text();
                    throw new Error(err);
                }
            } catch (error) {
                console.error('❌ 업로드 오류:', error);
                status.innerText = '❌ 업로드 실패: ' + error.message;
                status.style.color = '#ff4d4f';
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerText = '업로드 시작';
            }
        }

        window.onload = initEnv;

    </script>
</body>
</html>
